name: Lord Windows build

on:
  workflow_dispatch:

jobs:
  # Fronteira executavel: a maquina de desenvolvimento nao tem cargo, entao o unico
  # lugar onde o teste de Rust roda de verdade e aqui. Job separado do build para
  # falhar rapido e em paralelo (ADR-0011: o que e verificavel por script nao vira julgamento).
  test:
    name: Tests (Rust + TypeScript)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install --no-audit --no-fund   # mesmo contorno do job de build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Unit tests (cargo)
        run: npm run test:rust

  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # fixo: o package-lock.json foi gerado com npm 10.x (Node 20). lts/* usa npm mais novo, que rejeita o lock (ADR-0011: falha reprodutivel > falha misteriosa)
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install --no-audit --no-fund   # CONTORNO, nao correcao: npm ci falha porque o lock e o npm do runner divergem no dedupe de transitivas de @testing-library (lz-string, pretty-format). Voltar para npm ci quando o lock for regenerado com o mesmo npm do runner.

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: lord-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
